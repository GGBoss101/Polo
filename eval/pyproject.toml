[project]
name = "polo-eval"
version = "0.1.0"
description = "Evaluation harness for Polo extraction"
requires-python = ">=3.11"
dependencies = ["polo-extract"]

[tool.uv.sources]
polo-extract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polo_eval"]
