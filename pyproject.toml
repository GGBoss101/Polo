[project]
name = "polo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["polo-extract", "polo-eval"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["extraction", "eval"]

[tool.uv.sources]
polo-extract = { workspace = true }
polo-eval = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["extraction/tests", "eval/tests"]
addopts = "--import-mode=importlib"
